name: Windows Dist

on:
  workflow_dispatch:

concurrency:
  group: windows-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify versions and quality gates
        run: |
          node scripts/verify-release-version.mjs
          npm run check
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      - name: Sign and verify Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Authenticode certificate secrets are required for Windows GA artifacts."
          }
          $releaseRoot = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $appCandidates = @("$releaseRoot/Memoji.exe", "$releaseRoot/app.exe")
          $appPath = $appCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $setupPath = Get-ChildItem "$releaseRoot/bundle/nsis" -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appPath -or -not $setupPath) { throw "Application or NSIS setup was not produced." }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -File -Filter "signtool.exe" |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found on the runner." }
          $certificatePath = Join-Path $env:RUNNER_TEMP "memoji-authenticode.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            foreach ($binary in @($appPath, $setupPath.FullName)) {
              & $signTool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $binary
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $binary" }
              & $signTool.FullName verify /pa /all $binary
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $binary" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Collect artifacts and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $releaseRoot = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $output = "release/windows-x64"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $appCandidates = @("$releaseRoot/Memoji.exe", "$releaseRoot/app.exe")
          $appPath = $appCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $setupPath = Get-ChildItem "$releaseRoot/bundle/nsis" -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appPath -or -not $setupPath) { throw "Windows application or NSIS setup was not found after tauri build." }

          Copy-Item $appPath "$output/Memoji_${version}_x64.exe" -Force
          Copy-Item $setupPath.FullName "$output/Memoji_${version}_x64-setup.exe" -Force
          Copy-Item NOTICE.md "$output/NOTICE.md" -Force
          pwsh -File scripts/generate-sbom.ps1 -OutputPath "$output/sbom.cdx.json"
          node scripts/generate-checksums.mjs --input $output --output "$output/SHA256SUMS"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memoji-${{ steps.version.outputs.version }}-windows-x64
          path: release/windows-x64/*
          if-no-files-found: error
