name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package version (for example v2.0.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ matrix.platform.label }}
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux x64
            os: ubuntu-22.04
            rustTargets: x86_64-unknown-linux-gnu
            tauriArgs: --target x86_64-unknown-linux-gnu
            bundlePath: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          - label: macOS Universal
            os: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            tauriArgs: --target universal-apple-darwin
            bundlePath: src-tauri/target/universal-apple-darwin/release/bundle
          - label: Windows x64
            os: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            tauriArgs: --target x86_64-pc-windows-msvc
            bundlePath: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rustTargets }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify tag and application versions
        run: node scripts/verify-release-version.mjs --tag ${{ env.RELEASE_TAG }}

      - name: Frontend quality gate
        run: npm run check

      - name: Rust quality gate
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Memoji ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## Memoji ${{ env.RELEASE_TAG }}

            설치 파일과 함께 플랫폼별 SHA256SUMS, CycloneDX SBOM, NOTICE를 확인하세요.
            릴리스 승인 전 `docs/implementation/rollback-runbook.md`의 복구 절차를 검토해야 합니다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.tauriArgs }}

      - name: Generate checksums, SBOM, and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $provenance = "release/provenance/${{ runner.os }}"
          New-Item -ItemType Directory -Force -Path $provenance | Out-Null
          node scripts/generate-checksums.mjs --input "${{ matrix.platform.bundlePath }}" --output "$provenance/SHA256SUMS-${{ runner.os }}"
          pwsh -File scripts/generate-sbom.ps1 -OutputPath "$provenance/sbom-${{ runner.os }}.cdx.json"
          Copy-Item NOTICE.md "$provenance/NOTICE-${{ runner.os }}.md" -Force

      - name: Attach release provenance
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: release/provenance/${{ runner.os }}/*
          fail_on_unmatched_files: true

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoji-${{ runner.os }}-provenance
          path: release/provenance/${{ runner.os }}/*
          if-no-files-found: error
