name: Release Build

on:
  push:
    tags:
      - 'v*' # v1.0.0, v2.1.3 등의 태그가 푸시될 때 실행
  workflow_dispatch: # 수동 실행 가능

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin # Intel + Apple Silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Memoji ${{ github.ref_name }}'
          releaseBody: |
            ## Memoji ${{ github.ref_name }}
            
            ### 다운로드
            - **Windows**: MSI 또는 NSIS 설치 파일
            - **macOS**: DMG 파일 (Intel + Apple Silicon 지원)
            - **Linux**: DEB 또는 AppImage
            
            ### 변경사항
            이 릴리스의 변경사항을 여기에 작성하세요.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

