ly="NanumSquare, 'Malgun Gothic', sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="314" y="208">우측 검색과 로컬 AI를 한 화면에서 사용할 수 있도록 구성돼 있다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="314" y="257">현재 구조의 장점</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="287">• 좌측 탐색·중앙 작성·우측 보조의 역할이 직관적이다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="287">• 페이지를 보면서 AI 답변을 바로 삽입할 수 있다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="287">• VDI에서도 별도 웹 이동 없이 작업을 이어갈 수 있다.</text><rect fill="#ffffff" height="84" width="580" x="314" y="274" /><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="291">• 좌측 탐색·중앙 작성·우측 보조의 역할이 직관적이다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="315">• 페이지를 보면서 AI 답변을 바로 삽입할 수 있다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="339">• VDI에서도 별도 웹 이동 없이 작업을 이어갈 수 있다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="314" y="393">공간 문제</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="314" y="423">1,200px 창에서 좌우 패널이 각각 256px이므로 중앙은 약 688px이다.</text><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="3