I 아이디어 메모</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="10" font-weight="normal" text-anchor="end" x="235" y="238">•••</text><rect fill="#ffffff" height="138" rx="7" ry="7" stroke="#dce3ec" stroke-width="1" width="240" x="8" y="650" /><text fill="#172033" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="11" font-weight="bold" text-anchor="start" x="20" y="673">2026년 8월</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="20" y="696">일</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="51" y="696">월</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="82" y="696">화</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="113" y="696">수</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="144" y="696">목</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="175" y="696">금</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="206" y="696">토</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="20" y="724">9</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="51" y="724">10</text><text fill="#657084" font-family="NanumSquare, 'Malgun Gothic', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="82" y="724">11</text><t